name: Build Android APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
    paths:
      - 'client/**' # Automatically trigger if client code changes

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Web Assets
        working-directory: ./client
        run: npm run build
        env:
          VITE_API_BASE_URL: 'https://edi-food-adulteration.onrender.com/api'

      - name: Sync Capacitor
        working-directory: ./client
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Make gradlew executable
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: Build Android APK (Debug)
        working-directory: ./client/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectracheck-app-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
